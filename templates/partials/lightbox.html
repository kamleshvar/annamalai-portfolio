{% from "macros/ui.html" import icon %}
<div class="overlay-layer lightbox-layer" id="lightbox" hidden>
  <div class="overlay-backdrop" data-overlay-close></div>
  <section class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" tabindex="-1">
    <header class="lightbox__head">
      <span class="mono-label" id="lightbox-category">VISUAL ARCHIVE</span>
      <span class="lightbox__counter" id="lightbox-counter">01 / 01</span>
      <button type="button" class="icon-button" data-overlay-close aria-label="Close gallery viewer">{{ icon('x') }}</button>
    </header>
    <div class="lightbox__stage">
      <button type="button" class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="Previous photograph">{{ icon('arrow-left') }}</button>
      <figure class="lightbox__figure">
        <img id="lightbox-image" alt="">
        <figcaption>
          <span class="mono-label" id="lightbox-index">FRAME 001</span>
          <h3 id="lightbox-title">Untitled frame</h3>
          <p id="lightbox-description"></p>
        </figcaption>
      </figure>
      <button type="button" class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="Next photograph">{{ icon('arrow-right') }}</button>
    </div>
    <footer class="lightbox__foot">
      <span>USE ← → TO NAVIGATE / ESC TO CLOSE</span>
      <span>ARCHIVE VISUAL RECORD</span>
    </footer>
  </section>
</div>
