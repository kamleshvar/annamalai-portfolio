{% from "macros/ui.html" import icon %}
<div class="overlay-layer" id="secret-modal" hidden>
  <div class="overlay-backdrop" data-overlay-close></div>
  <section class="secret-dialog" role="dialog" aria-modal="true" aria-labelledby="secret-title" tabindex="-1">
    <header class="secret-dialog__head">
      <span class="mono-label" id="secret-label">HIDDEN RECORD</span>
      <button type="button" class="icon-button" data-overlay-close aria-label="Close hidden record">{{ icon('x') }}</button>
    </header>
    <div class="secret-dialog__sigil" aria-hidden="true">
      <span class="sigil-ring sigil-ring--outer"></span>
      <span class="sigil-ring sigil-ring--inner"></span>
      <span class="sigil-core"></span>
      <span class="sigil-axis sigil-axis--x"></span>
      <span class="sigil-axis sigil-axis--y"></span>
    </div>
    <p class="secret-dialog__eyebrow">ARCHIVE ANOMALY / VERIFIED</p>
    <h3 id="secret-title">THE ARTIFACT REMEMBERS</h3>
    <p class="secret-dialog__message" id="secret-message"></p>
    <div class="secret-dialog__fragment" id="secret-fragment" hidden>
      <span class="mono-label">ACCESS FRAGMENT <b id="secret-fragment-slot">01 / 04</b></span>
      <code id="secret-fragment-code">—</code>
      <span class="secret-dialog__command">TYPE IN THE TEMPAD / <strong>UNLOCK <span id="secret-fragment-command">—</span></strong></span>
    </div>
    <footer class="secret-dialog__foot">
      <span>RECORD RELEASED BY THE ARCHIVE</span>
      <div class="secret-dialog__foot-actions">
        <button type="button" class="btn btn-compact btn-ghost" data-secret-terminal>OPEN TEMPAD</button>
        <button type="button" class="btn btn-compact btn-ghost" data-overlay-close>CLOSE RECORD</button>
      </div>
    </footer>
  </section>
</div>
